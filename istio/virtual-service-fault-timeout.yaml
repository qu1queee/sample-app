apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cc-server
  namespace: cc-week11
spec:
  hosts:
  - cc-server
  http:
  - fault:
      delay:
        percentage:
          value: 100
        fixedDelay: 3s
    timeout: 1s
    route:
    - destination:
        host: cc-server
