replicaCount: 2

image:
  repository: cc-week09-server
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  appEnv: development
  appVersion: "1.0.0"

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

storage:
  size: 1Gi
  storageClassName: standard

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
