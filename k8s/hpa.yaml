apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cc-server-hpa
  namespace: cc-week09
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cc-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
