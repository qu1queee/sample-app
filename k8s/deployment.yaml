apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-server
  namespace: cc-week10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cc-server
  template:
    metadata:
      labels:
        app: cc-server
    spec:
      containers:
      - name: server
        image: docker.io/REGISTRY_USERNAME/cc-server:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: GREETING
          value: "Hello"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 1
          timeoutSeconds: 2
