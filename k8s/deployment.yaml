apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-server
  namespace: cc-week09
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cc-server
  template:
    metadata:
      labels:
        app: cc-server
    spec:
      containers:
      - name: server
        image: cc-week09-server:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: cc-config
        volumeMounts:
        - name: data
          mountPath: /data
        # TODO: add a resources block here (Part 3)
        # resources:
        #   requests:
        #     cpu: ""
        #     memory: ""
        #   limits:
        #     cpu: ""
        #     memory: ""
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 1
          timeoutSeconds: 2
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cc-data
