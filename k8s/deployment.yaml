apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-server
  namespace: cc-week08
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cc-server
  template:
    metadata:
      labels:
        app: cc-server
    spec:
      containers:
      - name: server
        image: cc-week08-server:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: cc-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 1
          timeoutSeconds: 2
